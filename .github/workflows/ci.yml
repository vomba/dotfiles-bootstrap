name: Native implementation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Ubuntu 24.04 amd64
          - os: macos-15
            name: macOS arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Acquire repository-owned native check tools
        shell: bash
        run: |
          ./bootstrap bootstrap --verification-tools --yes --verification-only --home "$RUNNER_TEMP/dotfiles-home"
      - name: Verify native implementation (no activation)
        shell: bash
        run: |
          ./bootstrap verify --checks --verification-only --home "$RUNNER_TEMP/dotfiles-home"
